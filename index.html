<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>研究問卷</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <!-- Page 1：研究說明 -->
    <section id="consent-page" class="page">

      <h1>研究參與說明</h1>

      <p>
        您好，感謝您參與本研究。
      </p>

      <p>
        本研究旨在了解受試者對特定情境內容的看法與反應。
        問卷內容僅供學術研究使用，您的回答將以匿名方式進行分析。
      </p>

      <p>
        本問卷沒有標準答案，請依照您的真實感受作答。
        您可以自由決定是否參與，也可以在填答過程中隨時停止。
      </p>

      <p>
        若您已閱讀上述說明，並同意參與本研究，
        請點選下方「我同意參與研究」。
      </p>

      <button id="consent-btn">
        我同意參與研究
      </button>

    </section>


    <!-- Page 2：實驗情境 -->
    <section id="scenario-page" class="page hidden">

      <div id="loading-message">
        正在載入研究內容，請稍候...
      </div>

      <div id="condition-content"></div>

      <button id="scenario-next-btn" class="hidden">
        下一頁
      </button>

    </section>


    <!-- Page 3：先放測試頁 -->
    <section id="questionnaire-page" class="page hidden">

      <h1>問卷題目</h1>

      <p>
        這裡之後會放共同問卷。
      </p>

    </section>

  </div>

  <script src="script.js"></script>

</body>
</html>
