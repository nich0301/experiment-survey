<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>研究問卷</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <!-- ========================= -->
  <!-- Page 1：研究說明 -->
  <!-- ========================= -->

  <section id="page-1" class="page">

    <h1>研究參與說明</h1>

    <p>
      您好，感謝您參與本研究。
    </p>

    <p>
      本研究旨在了解受試者在特定旅遊情境下，
      對相關資訊與服務的看法與反應。
    </p>

    <p>
      本問卷僅供學術研究使用，您的回答將以匿名方式進行分析。
      本問卷沒有標準答案，請依照您的真實感受作答。
    </p>

    <p>
      您可以自由決定是否參與，也可以在填答過程中隨時停止。
    </p>

    <button id="consent-btn">
      我同意參與研究
    </button>

  </section>


  <!-- ========================= -->
  <!-- Page 2：情境＋實驗材料＋檢核 -->
  <!-- ========================= -->

  <section id="page-2" class="page hidden">

    <h1>情境說明</h1>

    <div class="scenario-intro">
      <p>
        請仔細閱讀以下情境，並想像自己正在使用下列旅遊服務。
      </p>
    </div>

    <div id="condition-content"></div>


    <hr>

    <h2>請回答以下問題</h2>


    <!-- Attention Check -->

    <div class="question">
      <p>AC1. 注意力檢查題 1</p>

      <select id="AC1" required>
        <option value="">請選擇</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
      </select>
    </div>


    <div class="question">
      <p>AC2. 注意力檢查題 2</p>

      <select id="AC2" required>
        <option value="">請選擇</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
      </select>
    </div>


    <!-- Text Emotion Manipulation Check -->

    <h3>文字內容感受</h3>

    <div id="TXT_MC_questions"></div>


    <!-- Avatar Realism Manipulation Check -->

    <h3>化身樣貌感受</h3>

    <div id="AVR_MC_questions"></div>


    <button id="page2-next">
      下一頁
    </button>

  </section>


  <!-- ========================= -->
  <!-- Page 3：主要問項（一） -->
  <!-- ========================= -->

  <section id="page-3" class="page hidden">

    <h1>問卷題目</h1>

    <div id="page3-questions"></div>

    <button id="page3-next">
      下一頁
    </button>

  </section>


  <!-- ========================= -->
  <!-- Page 4：主要問項（二）＋基本資料 -->
  <!-- ========================= -->

  <section id="page-4" class="page hidden">

    <h1>問卷題目</h1>

    <div id="page4-questions"></div>


    <h2>個人基本資料</h2>

    <div id="demographic-questions"></div>


    <button id="submit-btn">
      送出問卷
    </button>


    <div id="thank-you-message" class="hidden">

      <hr>

      <h2>問卷已成功送出</h2>

      <p>
        感謝您撥冗參與本研究，您的回答對本研究十分重要。
      </p>

      <p>
        您現在可以關閉此頁面。
      </p>

    </div>

  </section>

</div>

<script src="script.js"></script>

</body>
</html>
